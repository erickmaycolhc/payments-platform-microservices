server.port=8083
spring.application.name=NOTIFICATION-SERVICE

# R2DBC (use application)
spring.r2dbc.url=r2dbc:postgresql://localhost:5435/notifications_db
spring.r2dbc.username=${DB_USER}
spring.r2dbc.password=${DB_PASSWORD}

# Flyway (use JDBC)
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://localhost:5435/notifications_db
spring.flyway.user=${DB_USER}
spring.flyway.password=${DB_PASSWORD}
spring.flyway.locations=classpath:db/migration

# Kafka (consumer)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Decimals BigDecimal, not double
spring.jackson.deserialization.use-big-decimal-for-floats=true
